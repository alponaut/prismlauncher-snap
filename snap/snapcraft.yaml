name: prismlauncher-alpo
title: Prism Launcher
base: core24
version: '10.0.5'

license: GPL-3.0
website: https://prismlauncher.org
contact: https://github.com/alponaut/prismlauncher-snap/issues
issues: https://github.com/alponaut/prismlauncher-snap/issues
source-code: https://github.com/alponaut/prismlauncher-snap

grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libflite.so:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libflite.so.1
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libflite_cmu_us_kal16.so:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libflite_cmu_us_kal16.so.1
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib

apps:
  prismlauncher:
    extensions: [kde-neon-6]
    command: usr/bin/prismlauncher
    desktop: usr/share/applications/org.prismlauncher.PrismLauncher.desktop
    common-id: org.prismlauncher.PrismLauncher
    environment: 
      ALSA_CONFIG_PATH: "$SNAP/etc/asound.conf"
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$LD_LIBRARY_PATH
    plugs:
      - desktop
      - desktop-legacy
      - opengl
      - wayland
      - x11
      - audio-playback
      - network
      - network-bind
      - joystick
      - home
      - screen-inhibit-control

parts:
  prismlauncher:
    plugin: cmake
    source: https://github.com/PrismLauncher/PrismLauncher.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    parse-info:
      - usr/share/metainfo/org.prismlauncher.PrismLauncher.metainfo.xml
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DBUILD_TESTING=OFF
      - -DLauncher_BUILD_PLATFORM=snap
      - -DLauncher_ENABLE_JAVA_DOWNLOADER=ON
    build-packages:
      - cmark
      - ninja-build
      - extra-cmake-modules
      - openjdk-17-jdk
      - libgl1-mesa-dev
      - duktape-dev
      - libarchive-dev
      - libtomlplusplus-dev
      - libproxy-dev
      - libxkbcommon-dev
      - libvulkan-dev
      - libcmark-dev
      - libqrencode-dev
      - pkg-config
      - gamemode-dev
    stage-packages:
      - x11-xserver-utils
      - libtomlplusplus3t64
      - libcmark0.30.2
      - flite
      - gamemode
      - libasound2t64
      - libasound2-plugins
      - libpulse0

  alsa-pulseaudio:
    after: [prismlauncher]
    plugin: nil
    override-build: |
      mkdir etc -p
      cat > etc/asound.conf <<EOF
      pcm.!default {
          type pulse
          fallback "sysdefault"
          hint {
              show on
              description "Default ALSA Output (currently PulseAudio Sound Server)"
          }
      }
      ctl.!default {
          type pulse
          fallback "sysdefault"
      }
      EOF
  
  gpu-2404:
    after: [prismlauncher, alsa-pulseaudio]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
      # Workaround for https://bugs.launchpad.net/snapd/+bug/2055273
      mkdir -p "${CRAFT_PRIME}/gpu-2404"
    prime:
    - bin/gpu-2404-wrapper
         
